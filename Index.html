<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — Nouveau Roadshow Pictures</title>
  <meta name="description" content="Nouveau Roadshow Pictures — Transparent theatrical distribution for independent films. Launching 2026.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;0,6..96,800;1,6..96,400;1,6..96,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            purple: {
              950: '#060210',
              900: '#1a0a2e',
              800: '#2d1248',
              700: '#4a1f7a',
              600: '#6b2fa0',
              500: '#8b3fbf',
            },
            amber: {
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            },
          },
          fontFamily: {
            display: ['"Bodoni Moda"', 'Georgia', 'serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    ::selection {
      background: rgba(139, 63, 191, 0.4);
      color: #fbbf24;
    }

    body {
      background: #060210;
      color: #e2d9f3;
    }

    .gradient-text {
      background: linear-gradient(135deg, #fcd34d 0%, #fbbf24 35%, #f59e0b 65%, #fcd34d 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shimmer 6s ease-in-out infinite;
    }

    @keyframes gradient-shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .film-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    @keyframes pulse-slow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    .pulse-slow {
      animation: pulse-slow 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .float-anim {
      animation: float 6s ease-in-out infinite;
    }

    .notify-form input:focus {
      outline: none;
      border-color: #8b3fbf;
      box-shadow: 0 0 0 2px rgba(139, 63, 191, 0.3);
    }

    /* Film-frame corner marks */
    .film-frame::before,
    .film-frame::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .film-frame::before {
      top: -1px;
      left: -1px;
      border-top: 1px solid rgba(251, 191, 36, 0.2);
      border-left: 1px solid rgba(251, 191, 36, 0.2);
    }
    .film-frame::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 1px solid rgba(251, 191, 36, 0.2);
      border-right: 1px solid rgba(251, 191, 36, 0.2);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #060210; }
    ::-webkit-scrollbar-thumb { background: #4a1f7a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b2fa0; }
  </style>
</head>
<body class="font-sans antialiased">

  <!-- Film grain overlay -->
  <div class="film-grain"></div>

  <!-- Background decorative elements -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <div class="absolute -top-1/4 -right-1/4 w-[800px] h-[800px] bg-purple-700/5 rounded-full blur-3xl pulse-slow"></div>
    <div class="absolute -bottom-1/4 -left-1/4 w-[600px] h-[600px] bg-amber-500/3 rounded-full blur-3xl pulse-slow" style="animation-delay: 2s;"></div>
  </div>

  <!-- Main Content -->
  <main class="relative min-h-screen flex items-center justify-center px-6">
    <div class="max-w-xl mx-auto text-center">

      <!-- Logo -->
      <div class="mb-10">
        <svg viewBox="0 0 40 40" class="w-14 h-14 mx-auto">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7c3aed"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="3" fill="url(#logoGrad)"/>
          <rect x="3" y="4" width="5" height="3.5" rx="0.8" fill="rgba(0,0,0,0.3)"/>
          <rect x="3" y="11" width="5" height="3.5" rx="0.8" fill="rgba(0,0,0,0.3)"/>
          <rect x="3" y="18" width="5" height="3.5" rx="0.8" fill="rgba(0,0,0,0.3)"/>
          <rect x="3" y="25" width="5" height="3.5" rx="0.8" fill="rgba(0,0,0,0.3)"/>
          <rect x="3" y="32" width="5" height="3.5" rx="0.8" fill="rgba(0,0,0,0.3)"/>
          <rect x="32" y="4" width="5" height="3.5" rx="0.8" fill="rgba(0,0,0,0.3)"/>
          <rect x="32" y="11" width="5" height="3.5" rx="0.8" fill="rgba(0,0,0,0.3)"/>
          <rect x="32" y="18" width="5" height="3.5" rx="0.8" fill="rgba(0,0,0,0.3)"/>
          <rect x="32" y="25" width="5" height="3.5" rx="0.8" fill="rgba(0,0,0,0.3)"/>
          <rect x="32" y="32" width="5" height="3.5" rx="0.8" fill="rgba(0,0,0,0.3)"/>
          <text x="20" y="27" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="18" fill="white">N</text>
        </svg>
      </div>

      <!-- Title -->
      <p class="font-sans text-xs uppercase tracking-[0.35em] text-amber-400/70 mb-6">Est. 2026 — Los Angeles</p>

      <h1 class="mb-3">
        <span class="font-display text-5xl sm:text-6xl md:text-7xl font-bold leading-[0.95] text-white tracking-[0.12em] sm:tracking-[0.15em] block">
          NOUVEAU
        </span>
      </h1>
      <div class="flex justify-center mb-3">
        <div class="h-px bg-gradient-to-r from-transparent via-amber-400/50 to-transparent w-48 sm:w-64"></div>
      </div>
      <h1 class="mb-2">
        <span class="font-display text-5xl sm:text-6xl md:text-7xl font-bold leading-[0.95] gradient-text tracking-[0.08em] sm:tracking-[0.12em] block">
          ROADSHOW
        </span>
      </h1>
      <h1 class="mb-8">
        <span class="font-display text-xl sm:text-2xl md:text-3xl font-bold leading-[1.2] text-white/30 tracking-[0.25em] sm:tracking-[0.35em] block">
          PICTURES
        </span>
      </h1>

      <!-- Divider -->
      <div class="h-px bg-gradient-to-r from-transparent via-amber-500/40 to-transparent max-w-sm mx-auto mb-8"></div>

      <!-- Coming Soon badge -->
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-purple-700/30 bg-purple-900/20 mb-8">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        <span class="text-xs text-white/40 uppercase tracking-widest">Coming Soon — Launching 2026</span>
      </div>

      <!-- Description -->
      <p class="text-base sm:text-lg text-white/50 font-light max-w-md mx-auto leading-relaxed mb-10">
        Transparent theatrical distribution for independent films.<br class="hidden sm:inline">
        No hidden fees. No rights grabs. No predatory terms.
      </p>

      <!-- Notify Form -->
      <div class="relative film-frame max-w-md mx-auto mb-8">
        <form id="notify-form" class="notify-form p-6 rounded-lg border border-purple-800/20 bg-purple-900/10">
          <p class="text-xs uppercase tracking-widest text-white/30 mb-4">Get notified when we launch</p>
          <div class="flex flex-col sm:flex-row gap-3">
            <input type="email" id="notify-email" required
              class="flex-1 bg-purple-950/50 border border-purple-800/30 rounded px-4 py-3 text-sm text-white/90 placeholder-white/20 transition-all duration-300"
              placeholder="your@email.com">
            <button type="submit" id="notify-btn"
              class="px-6 py-3 rounded bg-amber-400 hover:bg-amber-300 text-purple-950 font-sans text-sm font-semibold transition-all duration-300 hover:shadow-lg hover:shadow-amber-400/20 whitespace-nowrap flex items-center justify-center gap-2">
              <span id="notify-text">Notify Me</span>
              <i data-lucide="bell" class="w-4 h-4" id="notify-icon"></i>
              <svg id="notify-spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-linecap="round" class="opacity-25"></circle>
                <path d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" fill="currentColor" class="opacity-75"></path>
              </svg>
            </button>
          </div>
          <!-- Success message -->
          <div id="notify-success" class="hidden mt-4 p-4 rounded-lg border border-green-500/20 bg-green-500/5">
            <div class="flex items-center gap-2">
              <i data-lucide="check-circle-2" class="w-4 h-4 text-green-400 flex-shrink-0"></i>
              <p class="text-xs text-green-300">You're on the list. We'll be in touch.</p>
            </div>
          </div>
        </form>
      </div>

      <!-- Contact link -->
      <a href="mailto:info@nouveauroadshow.com" class="inline-flex items-center gap-2 text-sm text-amber-400/50 hover:text-amber-400 transition-colors">
        <i data-lucide="mail" class="w-4 h-4"></i>
        info@nouveauroadshow.com
      </a>

      <!-- Scroll hint -->
      <div class="mt-16 float-anim">
        <i data-lucide="chevron-down" class="w-5 h-5 text-white/15 mx-auto"></i>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Notify form handler
    const form = document.getElementById('notify-form');
    const btn = document.getElementById('notify-btn');
    const text = document.getElementById('notify-text');
    const icon = document.getElementById('notify-icon');
    const spinner = document.getElementById('notify-spinner');
    const success = document.getElementById('notify-success');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btn.disabled = true;
      text.textContent = 'Submitting...';
      icon.classList.add('hidden');
      spinner.classList.remove('hidden');

      await new Promise(resolve => setTimeout(resolve, 1500));

      btn.disabled = false;
      text.textContent = 'Notify Me';
      icon.classList.remove('hidden');
      spinner.classList.add('hidden');

      success.classList.remove('hidden');
      form.reset();
      lucide.createIcons();

      setTimeout(() => {
        success.classList.add('hidden');
      }, 6000);
    });
  </script>
</body>
</html>
